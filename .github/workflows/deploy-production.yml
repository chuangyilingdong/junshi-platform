name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Validate commit on main
        env:
          TARGET_COMMIT: ${{ inputs.commit }}
        run: |
          if ! [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full 40-character lowercase SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:platform
      - run: pnpm test:api
      - run: pnpm test:healthcheck
      - run: pnpm verify:release-runtime
      - run: node scripts/verify-migration.mjs
      - run: node scripts/audit-api-dependencies.mjs
      - run: node scripts/verify-deploy-templates.mjs

      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production
        env:
          TARGET_COMMIT: ${{ inputs.commit }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "${PROD_SSH_PORT:-22}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "deploy '$TARGET_COMMIT'"
